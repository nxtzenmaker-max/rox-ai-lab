<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RJN — AI Voice Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #06070b radial-gradient(circle at 50% 36%, #150e26 0%, #06070b 80%);
    color: #f8fafc;
    letter-spacing: -0.01em;
  }
  html.t, html.t body { background: transparent !important; }
  
  /* Canvas & Glow */
  canvas {
    touch-action: none;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    background: transparent;
    z-index: 1;
  }
  #glow {
    position: fixed;
    left: 50%;
    top: 36%;
    width: 80vmin;
    height: 80vmin;
    margin: -40vmin 0 0 -40vmin;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0.38;
    filter: blur(52px);
    background: radial-gradient(circle, rgba(244, 114, 182, 0.28) 0%, rgba(168, 85, 247, 0.16) 45%, rgba(0, 0, 0, 0) 70%);
    z-index: 0;
    transition: opacity 0.5s ease, background 0.8s ease;
  }

  /* UI Layer (HUD) */
  .hud-layer {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px 20px calc(20px + env(safe-area-inset-bottom, 0px)) 20px;
  }
  
  /* Top Bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    pointer-events: auto;
  }
  .brand-capsule {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(18, 19, 28, 0.65);
    padding: 7px 16px;
    border-radius: 9999px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
  }
  .status-jewel {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 10px #10b981;
    animation: pulse-jewel 2.5s infinite ease-in-out;
  }
  @keyframes pulse-jewel { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.4; transform:scale(0.85);} }
  .brand-title {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #ffffff 0%, #f472b6 60%, #c084fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand-tag {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #94a3b8;
    background: rgba(255, 255, 255, 0.06);
    padding: 2px 7px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  /* Status Pill */
  .status-pill {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 9999px;
    background: rgba(16, 185, 129, 0.1);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.25);
    white-space: nowrap;
    transition: all 0.3s ease;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .status-pill.speaking {
    background: rgba(244, 63, 94, 0.16);
    color: #fb7185;
    border-color: rgba(244, 63, 94, 0.4);
    box-shadow: 0 0 16px rgba(244, 63, 94, 0.25);
  }
  .status-pill.thinking {
    background: rgba(245, 158, 11, 0.16);
    color: #fbbf24;
    border-color: rgba(245, 158, 11, 0.4);
    box-shadow: 0 0 14px rgba(245, 158, 11, 0.2);
  }
  .status-pill.listening {
    background: rgba(56, 189, 248, 0.18);
    color: #38bdf8;
    border-color: rgba(56, 189, 248, 0.45);
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
  }
  
  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(18, 19, 28, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .icon-btn:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.12);
    transform: scale(1.05);
  }

  /* Subtitles Card (Floating Fluid Speech Canvas) */
  .subtitles-box {
    max-width: 540px;
    width: 100%;
    margin: 0 auto 12px auto;
    padding: 12px 18px;
    background: rgba(14, 15, 24, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 20px;
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55), 0 0 20px rgba(244, 114, 182, 0.04);
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 125px;
    overflow-y: auto;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: auto;
  }
  .subtitles-box::-webkit-scrollbar {
    width: 3px;
  }
  .subtitles-box::-webkit-scrollbar-track {
    background: transparent;
  }
  .subtitles-box::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 3px;
  }
  .sub-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }
  .speaker-pill {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 8px;
  }
  .speaker-pill.speaker-rjn {
    background: linear-gradient(135deg, rgba(244, 114, 182, 0.25), rgba(192, 132, 252, 0.25));
    color: #f472b6;
    border: 1px solid rgba(244, 114, 182, 0.4);
    box-shadow: 0 0 10px rgba(244, 114, 182, 0.15);
  }
  .speaker-pill.speaker-user {
    background: rgba(255, 255, 255, 0.08);
    color: #e2e8f0;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
  .sub-emo {
    font-size: 11px;
    font-weight: 700;
    color: #cbd5e1;
    background: rgba(255, 255, 255, 0.06);
    padding: 2px 8px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .sub-body {
    font-size: 14.5px;
    font-weight: 500;
    line-height: 1.5;
    color: #f8fafc;
    letter-spacing: 0.2px;
    word-break: break-word;
  }

  /* Bottom Controls (Unified Frictionless Dock) */
  .bottom-controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 540px;
    margin: 0 auto;
    pointer-events: auto;
  }
  
  .unified-dock {
    display: flex;
    align-items: center;
    width: 100%;
    height: 54px;
    background: rgba(18, 19, 30, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 9999px;
    padding: 4px 6px 4px 20px;
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    transition: border-color 0.25s, box-shadow 0.25s;
    gap: 8px;
  }
  .unified-dock:focus-within {
    border-color: rgba(244, 114, 182, 0.45);
    box-shadow: 0 8px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(244, 114, 182, 0.15);
  }
  .dock-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #f8fafc;
    font-size: 14.5px;
    font-weight: 500;
  }
  .dock-input::placeholder {
    color: rgba(255, 255, 255, 0.38);
    font-weight: 400;
  }
  .dock-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .mic-button {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #f43f5e 0%, #a855f7 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(244, 63, 94, 0.35);
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
  }
  .mic-button:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 24px rgba(244, 63, 94, 0.5);
  }
  .mic-button:active {
    transform: scale(0.96);
  }
  .mic-button.active {
    background: linear-gradient(135deg, #ef4444 0%, #ec4899 100%);
    box-shadow: 0 0 25px rgba(239, 68, 68, 0.7);
    animation: pulse-mic 1.6s infinite ease-in-out;
  }
  @keyframes pulse-mic {
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08); box-shadow: 0 0 35px rgba(236, 72, 153, 0.8);}
  }
  
  .send-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #f43f5e 0%, #a855f7 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(244, 63, 94, 0.35);
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .send-btn:hover {
    transform: scale(1.05);
  }

  /* Camera Shutter Flash */
  .camera-flash {
    position: fixed; inset: 0; background: #fff; z-index: 9999;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease-out;
  }
  .camera-flash.flash-active { opacity: 0.9; transition: none; }

  /* Photo Snapshot Modal */
  .photo-modal {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(4, 6, 12, 0.85);
    backdrop-filter: blur(16px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .photo-card {
    background: rgba(18, 19, 28, 0.95);
    border: 1px solid rgba(244, 114, 182, 0.35);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 30px rgba(244, 114, 182, 0.15);
    border-radius: 22px;
    padding: 20px;
    max-width: 420px;
    width: 100%;
    display: flex; flex-direction: column; gap: 14px;
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  .photo-header {
    display: flex; justify-content: space-between; align-items: center;
  }
  .photo-title {
    color: #f472b6; font-size: 14px; font-weight: 700; letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 6px;
  }
  .photo-close-btn {
    background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; padding: 4px; line-height: 1;
  }
  .photo-close-btn:hover { color: #fff; }
  .photo-img {
    width: 100%; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1);
    object-fit: cover; max-height: 320px;
  }
  .photo-actions {
    display: flex; gap: 10px; justify-content: flex-end;
  }
  .photo-btn {
    background: linear-gradient(135deg, #f43f5e, #c084fc);
    color: #fff; font-size: 13px; font-weight: 600;
    padding: 9px 18px; border-radius: 12px; border: none; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
    transition: 0.2s;
  }
  .photo-btn:hover { transform: scale(1.03); }
  .photo-btn.secondary {
    background: rgba(255, 255, 255, 0.08); color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.12);
  }

</style>
</head>
<body>

<div id="cameraFlash" class="camera-flash"></div>
<video id="cameraFeed" autoplay playsinline style="display:none;"></video>
<canvas id="photoCanvas" style="display:none;"></canvas>

<!-- Photo Modal -->
<div id="photoModal" class="photo-modal" style="display:none;">
  <div class="photo-card">
    <div class="photo-header">
      <span class="photo-title">📷 Photo Snapshot</span>
      <button class="photo-close-btn" onclick="closePhotoModal()">✕</button>
    </div>
    <img id="photoPreview" class="photo-img" src="" alt="Captured Photo" />
    <div class="photo-actions">
      <a id="photoDownloadBtn" class="photo-btn" download="rjn-snapshot.jpg">💾 Download</a>
      <button class="photo-btn secondary" onclick="closePhotoModal()">Done</button>
    </div>
  </div>
</div>

<div id="glow"></div>
<canvas id="c"></canvas>

<div class="hud-layer">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand-capsule">
      <div class="status-jewel"></div>
      <span class="brand-title">RJN</span>
      <span class="brand-tag">AI COMPANION</span>
    </div>
    <div class="top-actions">
      <span id="statusLabel" class="status-pill online">ONLINE</span>
      <button id="quickCameraBtn" class="icon-btn" title="Take Selfie / Photo" onclick="capturePhotoAction('front')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </button>
    </div>
  </div>

  <!-- Bottom Controls & Subtitles (Frictionless Unified Dock) -->
  <div class="bottom-controls">
    <div id="subtitlesBox" class="subtitles-box" style="display:none;">
      <div id="subtitlesText"></div>
    </div>

    <form id="textForm" class="unified-dock" onsubmit="event.preventDefault(); submitText();">
      <input id="textInput" class="dock-input" type="text" placeholder="Talk with RJN or type anything..." autocomplete="off">
      <div class="dock-actions">
        <button type="button" id="micBtn" class="mic-button" title="Tap to Talk">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>
        <button type="submit" id="sendBtn" class="send-btn" title="Send" style="display:none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  var canvas = document.getElementById('c');
  var gl = canvas.getContext('webgl2', {alpha:true, premultipliedAlpha:true, antialias:true});
  if(!gl){ document.body.textContent='WebGL2 not supported'; return; }

  if(/transparent/.test(location.search + location.hash)) document.documentElement.classList.add('t');
  var NB = 32;               // frequency bands
  var SPHERE_N = 3200;       // sphere dots

  /* ---------- geometry: fibonacci sphere dots + ring dots ---------- */
  var data = [];
  var ga = Math.PI * (3 - Math.sqrt(5));
  for (var i = 0; i < SPHERE_N; i++) {
    var y = 1 - (i / (SPHERE_N - 1)) * 2;
    var r = Math.sqrt(1 - y * y);
    var t = ga * i;
    data.push(Math.cos(t) * r, y, Math.sin(t) * r, 0);
  }
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);

  /* ---------- shaders ---------- */
  var vs = '#version 300 es\n' +
  'precision highp float;\n' +
  'in vec3 aPos; in float aType;\n' +
  'uniform float uBands[' + NB + '];\n' +
  'uniform float uTime, uLevel, uDpr, uSize, uScale;\n' +
  'uniform vec3 uColA, uColB, uColC;\n' +
  'uniform float uGlow;\n' +
  'uniform vec4 uTouch;\n' +
  'out vec4 vCol;\n' +
  'float band(float t){ float f=clamp(t,0.,1.)*float(' + (NB - 1) + '); int a=int(floor(f)); int b=min(a+1,' + (NB - 1) + '); return mix(uBands[a],uBands[b],fract(f)); }\n' +
  'void main(){\n' +
  '  vec3 p; float size; float alpha; float rim = 0.0;\n' +
  '  float h = fract(sin(dot(aPos, vec3(12.9898,78.233,37.719)))*43758.5453);\n' +
  '  if(aType < 0.5){\n' +
  '    float lon = abs(atan(aPos.x, aPos.z)) / 3.14159265;\n' +
  '    float lat = abs(aPos.y);\n' +
  '    float e = band(mix(lon, lat, 0.35));\n' +
  '    float ripple = 0.5 + 0.5*sin(uTime*0.3 + aPos.y*7.0 + aPos.x*3.0);\n' +
  '    float d = e*0.055*(0.7+0.3*ripple);\n' +
  '    p = aPos*(0.80 + d)*uScale;\n' +
  '    float ay = uTime*0.02;\n' +
  '    float ax = sin(uTime*0.08)*0.03;\n' +
  '    float cy=cos(ay), sy=sin(ay);\n' +
  '    p = vec3(cy*p.x + sy*p.z, p.y, -sy*p.x + cy*p.z);\n' +
  '    float cx=cos(ax), sx=sin(ax);\n' +
  '    p = vec3(p.x, cx*p.y - sx*p.z, sx*p.y + cx*p.z);\n' +
  '    float age = clamp(uTime - uTouch.z, 0.0, 6.0);\n' +
  '    float dist = length(p.xy - uTouch.xy);\n' +
  '    float wave = sin(dist*12.0 - age*8.0) * exp(-dist*2.0) * exp(-age*1.6) * uTouch.w;\n' +
  '    p *= 1.0 + wave*0.08;\n' +
  '    float depth = p.z*0.5+0.5;\n' +
  '    size = uSize*(0.75+0.55*depth)*(1.0+e*0.5);\n' +
  '    alpha = 0.25 + 0.75*depth;\n' +
  '    alpha *= 0.65 + e*0.6;\n' +
  '    rim = pow(1.0 - clamp(abs(p.z)/(0.8*uScale),0.,1.), 2.0);\n' +
  '    alpha *= 0.75 + 0.25*sin(uTime*1.3 + h*40.0);\n' +
  '    alpha += rim*0.35;\n' +
  '    size *= 1.0 + rim*0.3;\n' +
  '    if(h > 0.97) size *= 1.8;\n' +
  '  } else {\n' +
  '    float a = aPos.x;\n' +
  '    float m = abs(a/3.14159265 - 1.0);\n' +
  '    float e = band(m);\n' +
  '    float rad = (1.02 + e*0.16)*mix(1.0, uScale, 0.6);\n' +
  '    p = vec3(cos(a)*rad, sin(a)*rad, 0.0);\n' +
  '    size = uSize*(0.9+e*1.1);\n' +
  '    alpha = 0.45 + e*0.55;\n' +
  '  }\n' +
  '  alpha = clamp(alpha, 0.0, 1.0);\n' +
  '  float g = smoothstep(-0.9, 0.9, p.y + sin(uTime*0.15 + p.x)*0.25);\n' +
  '  vec3 col = mix(uColA, uColB, g);\n' +
  '  col = mix(col, uColC, clamp(rim*0.7 + uGlow*0.35, 0.0, 1.0));\n' +
  '  col += vec3(rim*0.25 + uGlow*0.15);\n' +
  '  col = mix(col, vec3(1.0), step(0.97, h)*0.6);\n' +
  '  vCol = vec4(col*alpha, alpha);\n' +
  '  gl_Position = vec4(p.xy*0.76, 0.0, 1.0);\n' +
  '  gl_PointSize = size*uDpr;\n' +
  '}\n';

  var fs = '#version 300 es\n' +
  'precision highp float;\n' +
  'in vec4 vCol; out vec4 o;\n' +
  'void main(){\n' +
  '  vec2 c = gl_PointCoord*2.0-1.0;\n' +
  '  float d = dot(c,c);\n' +
  '  if(d>1.0) discard;\n' +
  '  float a = smoothstep(1.0,0.35,d);\n' +
  '  o = vCol*a;\n' +
  '}\n';

  function sh(type, src){
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  var vao = gl.createVertexArray();
  gl.bindVertexArray(vao);

  function updateBands(t){
    if(external){
      for(var i=0;i<NB;i++) target[i] = external[i] || 0;
    } else if(analyser && fft){
      analyser.getByteFrequencyData(fft);
      var usable = Math.floor(fft.length * 0.55);
      for(var b=0;b<NB;b++){
        var lo = Math.floor(Math.pow(b/NB, 1.6) * usable);
        var hi = Math.max(lo+1, Math.floor(Math.pow((b+1)/NB, 1.6) * usable));
        var s = 0; for(var k=lo;k<hi;k++) s += fft[k];
        target[b] = Math.min(1, (s/(hi-lo)/255) * 1.5);
      }
    } else {
      // Idle shimmering pulse
      for(var q=0;q<NB;q++){
        target[q] = 0.16 + 0.12*Math.sin(t*1.7 + q*0.55) + 0.08*Math.sin(t*3.1 + q*1.3);
      }
    }
    var lvl = 0;
    for(var i2=0;i2<NB;i2++){
      var tv = target[i2];
      var k2 = tv > bands[i2] ? 0.28 : 0.09;
      bands[i2] += (tv - bands[i2]) * k2;
      lvl += bands[i2];
    }
    return lvl / NB;

  var scale = 1.0, glow = 0.0;

  function hit(e){

    var now = performance.now();
    if(e.type === 'pointermove' && now - lastHit < 90) return;
    var half = Math.min(window.innerWidth, window.innerHeight) / 2;
    var u = (e.clientX - window.innerWidth / 2) / (half * 0.76);
    var v = -(e.clientY - window.innerHeight / 2) / (half * 0.76);
    if (Math.sqrt(u * u + v * v) > 0.83 * scale) return;
    lastHit = now;
    touchX = u; touchY = v; touchT = (now - t0) / 1000;
    touchS = e.type === 'pointerdown' ? 1.0 : 0.6;
    glow = Math.min(1, glow + 0.35);

  async function capturePhotoAction(facing) {

        cameraStream.getTracks().forEach(function(t) { t.stop(); });

      cameraStream = null;

        try {
          var devices = await navigator.mediaDevices.enumerateDevices();

              break;
            }

        if (backDeviceId) {
          try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
              video: {
                deviceId: { exact: backDeviceId },
                width: { ideal: 1920 },
                height: { ideal: 1080 }
              }
            });
          } catch(e) {}
        }

        // Strategy B: facingMode: { ideal: "environment" }
        if (!cameraStream) {
          try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 1920 },
                height: { ideal: 1080 }
              }
            });
          } catch(e) {}
        }

        // Strategy C: simple facingMode: "environment"
        if (!cameraStream) {
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" }
          });
        }
      } else {
        // Front / Selfie camera
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: "user" },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          });
        } catch(e) {
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" }
          });
        }
      }

      currentFacing = isBack ? 'back' : 'front';

      var video = document.getElementById('cameraFeed');
      video.srcObject = cameraStream;
      await video.play();

      setTimeout(function() {
        var canvas = document.getElementById('photoCanvas');
        canvas.width = video.videoWidth || (isBack ? 1280 : 720);
        canvas.height = video.videoHeight || (isBack ? 720 : 1280);
        var ctx = canvas.getContext('2d');

        if (!isBack) {
          // Mirror horizontally for natural selfie view
          ctx.translate(canvas.width, 0);
          ctx.scale(-1, 1);
        } else {
          // Unmirrored / authentic view for rear camera
          ctx.setTransform(1, 0, 0, 1, 0, 0);
        }

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.92);

        // Flash effect and shutter click
        triggerCameraFlash();

        var preview = document.getElementById('photoPreview');
        var modal = document.getElementById('photoModal');
        var dlBtn = document.getElementById('photoDownloadBtn');

        if (titleEl) {

          preview.src = dataUrl;

          modal.style.display = 'flex';

      .replace(/`[^`]*`/gi, '')
      .replace(/https?:\/\/\S+|ws:\/\/\S+/gi, '')
      .replace(/(?:file:\/\/\S+|\/[a-zA-Z0-9_\-\.]+(?:\/[a-zA-Z0-9_\-\.]+)+)/gi, '')
      .replace(/[{}\[\]\\\"`~*#|<>]*/gi, '')
      .replace(/\s+/g, ' ')
      .trim();

    // Discard empty, single-character, raw base64 or programming code chunks
    if (!clean || clean.length < 2) return;
    if (/^[A-Za-z0-9+/=]{25,}$/.test(clean)) return;
    if (/^(def |import |from |class |const |let |var |function |return )/.test(clean)) return;

    // Enforce max speech length per chunk (150 chars) to prevent 429 concurrency limit
    if (clean.length > 150) {
      clean = clean.substring(0, 150).trim();
    }

    var chunkIndex = totalChunksCreated++;
    var thisTurnId = currentTurnId;

    fetchTTSChunk(clean, chunkIndex, thisTurnId);
  }

  function safeDecodeAudio(arrayBuf) {
    return new Promise(function(resolve, reject) {
      if (!audioCtx) {
        reject(new Error("No audioCtx"));
        return;
      }
      var done = false;
      var timer = setTimeout(function() {
        if (!done) {
          done = true;
          reject(new Error("decodeAudioData timeout"));
        }
      }, 3500);

      try {
        var copy = arrayBuf.slice(0);
        var p = audioCtx.decodeAudioData(copy, function(decoded) {
          if (!done) {
            done = true;
            clearTimeout(timer);
            resolve(decoded);
          }
        }, function(err) {
          if (!done) {
            done = true;
            clearTimeout(timer);
            reject(err);
          }
        });
        if (p && typeof p.then === 'function') {
          p.then(function(buf) {
            if (!done) {
              done = true;
              clearTimeout(timer);
              resolve(buf);
            }
          }).catch(function(err) {
            if (!done) {
              done = true;
              clearTimeout(timer);
              reject(err);
            }
          });
        }
      } catch(e) {
        if (!done) {
          done = true;
          clearTimeout(timer);
          reject(e);
        }
      }
    });
  }

  async function fetchTTSChunk(text, index, turnId) {
    var ttsAbort = new AbortController();
    var ttsTimer = setTimeout(function() {
      try { ttsAbort.abort(); } catch(e){}
    }, 7000); // 7s hard timeout so TTS requests never hang indefinitely

    try {
      ensureAudioCtx();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      // Slight stagger between chunk requests to avoid Deepgram 429 concurrency limit
      if (index > 0) {
        await new Promise(function(r) { setTimeout(r, Math.min(index * 60, 240)); });
      }

      if (turnId !== currentTurnId) {
        clearTimeout(ttsTimer);
        return;
      }

      var ttsUrl = (vpsVoiceUrl ? vpsVoiceUrl : '') + '/api/tts';
      var resp;
      try {
        resp = await fetch(ttsUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text }),
          signal: ttsAbort.signal
        });
      } catch(netErr) {
        if (ttsUrl !== '/api/tts') {
          resp = await fetch('/api/tts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text }),
            signal: ttsAbort.signal
          });
        } else {
          throw netErr;
        }
      }
      clearTimeout(ttsTimer);

      if (turnId !== currentTurnId) return;

      if (!resp.ok) {
        handleChunkDecoded(index, null, turnId);
        return;
      }

      var arrayBuf = await resp.arrayBuffer();
      if (turnId !== currentTurnId) return;

      var audioBuf = await safeDecodeAudio(arrayBuf);
      if (turnId !== currentTurnId) return;

      handleChunkDecoded(index, audioBuf, turnId);
    } catch(err) {
      clearTimeout(ttsTimer);
      console.warn("TTS Chunk fetch error or timeout:", err);
      if (turnId === currentTurnId) {
        handleChunkDecoded(index, null, turnId);
      }
    }
  }

  function handleChunkDecoded(index, audioBuf, turnId) {
    if (turnId !== currentTurnId) return;
    pendingBuffers[index] = audioBuf;
    drainSequentialQueue(turnId);
  }

  function drainSequentialQueue(turnId) {
    if (turnId !== currentTurnId) return;

    // Process STRICTLY in sequential order (0, 1, 2, 3...)
    // If chunk 1 arrives before chunk 0, chunk 1 WAITS until chunk 0 is scheduled!
    while (pendingBuffers.hasOwnProperty(nextScheduleIndex)) {
      var buf = pendingBuffers[nextScheduleIndex];
      delete pendingBuffers[nextScheduleIndex];
      nextScheduleIndex++;

      if (buf) {
        scheduleAudioBuffer(buf);
      }
    }

    checkTurnFinished();
  }

  function scheduleAudioBuffer(buffer) {
    ensureAudioCtx();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    isSpeaking = true;
    setStatus("SPEAKING...", "speaking");
    glow = 0.8;

    var source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.connect(analyser); // Drives the WebGL Orb visualizer
    source.connect(audioCtx.destination); // Speaker out

    var now = audioCtx.currentTime;
    var startTime = Math.max(now, nextPlayTime);
    source.start(startTime);
    nextPlayTime = startTime + buffer.duration;

    activeSources.push(source);

    var hasEnded = false;
    function onSourceEnded() {
      if (hasEnded) return;
      hasEnded = true;
      var idx = activeSources.indexOf(source);
      if (idx > -1) activeSources.splice(idx, 1);
      checkTurnFinished();
    }

    source.onended = onSourceEnded;
    // Guaranteed fallback timer in case browser drops onended event
    setTimeout(onSourceEnded, Math.max(800, (buffer.duration + 0.5) * 1000));
  }

  function checkTurnFinished() {
    // A turn is truly finished only when:
    // 1. Text stream from Groq/Antigravity is finished
    // 2. All chunks have been scheduled
    // 3. All audio playback sources have finished playing
    if (isStreamingDone && nextScheduleIndex >= totalChunksCreated && activeSources.length === 0) {
      isSpeaking = false;
      glow = 0.0;
      setEmotion("neutral");
      if (isCallActive) {
        setTimeout(startListeningTurn, 250);
      } else {
        setStatus("READY", "");
      }
    }
  }

  // Live Token Streaming Groq -> Live Sentence Deepgram TTS
  async function sendToGroq(userMsg) {
    if (!userMsg.trim()) return;
    resetAudioEngine();

    setStatus("THINKING...", "thinking");
    setSubtitle("YOU", userMsg);

    chatHistory.push({ role: "user", content: userMsg });

    var fullReply = "";
    var currentSentence = "";
    var turnId = currentTurnId;
    var actionTriggered = false;

    // Detect explicit camera intent from what was spoken or typed
    var isBackIntent = /(back|rear|peeche|piche|peche|पीछे|बैक|रियर)/i.test(userMsg);
    var isFrontIntent = /(front|selfie|aage|अगला|सामने|फ्रंट|आगे|सेल्फी)/i.test(userMsg);

    // Active Watchdog: NEVER allow orb to hang in THINKING... state indefinitely!
    var thinkingWatchdog = setTimeout(function() {
      if (turnId === currentTurnId && totalChunksCreated === 0 && !isSpeaking) {
        console.warn("[Watchdog] Stream timed out in THINKING state, auto-resetting to READY");
        setStatus("READY", "");
        if (isCallActive) setTimeout(startListeningTurn, 200);
      }
    }, 12000);

    var abortCtrl = new AbortController();
    var abortTimer = setTimeout(function() {
      try { abortCtrl.abort(); } catch(e) {}
    }, 15000);

    try {
      var chatStreamUrl = (vpsVoiceUrl ? vpsVoiceUrl : '') + '/api/chat/stream';
      var resp;
      try {
        resp = await fetch(chatStreamUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: userMsg, history: chatHistory.slice(-3), conversation_id: activeConversationId }),
          signal: abortCtrl.signal
        });
      } catch(streamFetchErr) {
        if (chatStreamUrl !== '/api/chat/stream') {
          resp = await fetch('/api/chat/stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: userMsg, history: chatHistory.slice(-3), conversation_id: activeConversationId }),
            signal: abortCtrl.signal
          });
        } else {
          throw streamFetchErr;
        }
      }

      var reader = resp.body.getReader();
      var decoder = new TextDecoder("utf-8");
      var buffer = "";
      var streamCompleted = false;

      while (true) {
        var result = await reader.read();
        if (result.done) break;

        // Clear abort timer and watchdog as soon as stream data flows
        clearTimeout(abortTimer);
        clearTimeout(thinkingWatchdog);

        buffer += decoder.decode(result.value, { stream: true });
        var lines = buffer.split("\n\n");
        buffer = lines.pop();

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (line.startsWith("data: ")) {
            var dataStr = line.substring(6).trim();
            if (dataStr === "[DONE]") {
              streamCompleted = true;
              break;
            }

            try {
              var parsed = JSON.parse(dataStr);
              if (parsed.conversation_id) {
                activeConversationId = parsed.conversation_id;
                try { localStorage.setItem('rjn_conv_id', activeConversationId); } catch(e){}
              }

              var token = parsed.token || "";
              fullReply += token;

              // Clean token of any residual tags before appending to speech sentence
              var cleanToken = token
                .replace(/\[TERMINAL_VIEW(?:_B64)?:[\s\S]*?(?:\]|$)/gi, '')
                .replace(/\[(ACTION|EMOTION):[^\]]+\]/gi, '');
              if (cleanToken) {
                currentSentence += cleanToken;
              }

              var emo = detectEmotion(fullReply);
              if (emo !== currentEmotion && emo !== "neutral") {
                setEmotion(emo);
              }

              var cleanSubtitle = fullReply
                .replace(/\[TERMINAL_VIEW(?:_B64)?:[\s\S]*?(?:\]|$)/gi, '')
                .replace(/\[(ACTION|EMOTION):[^\]]+\]/gi, '')
                .replace(/```[\s\S]*?```/gi, '')
                .trim();
              setSubtitle("RJN", cleanSubtitle, emo);

              // Trigger photo capture command (front vs back) if requested
              var facingMatch = fullReply.match(/\[ACTION:\s*CAPTURE_PHOTO(?::(front|back))?\s*\]/i);
              if (!actionTriggered && facingMatch) {
                actionTriggered = true;
                var facing = 'front';
                if (facingMatch[1]) {
                  facing = facingMatch[1].toLowerCase();
                } else if (isBackIntent) {
                  facing = 'back';
                }
                if (isBackIntent && !isFrontIntent) {
                  facing = 'back';
                }
                capturePhotoAction(facing);
              }

              // High-quality sentence boundary detection for Devanagari Hindi
              var isEndPunctuation = /[।\.?!\n]/.test(token);
              var isClauseBreak = currentSentence.length >= 35 && /[,;]/.test(token);
              var isLongSentence = currentSentence.length >= 65 && /\s/.test(token);

              if ((isEndPunctuation || isClauseBreak || isLongSentence) && currentSentence.trim().length >= 25) {
                var chunk = currentSentence.trim();
                currentSentence = "";
                enqueueSentenceChunk(chunk);
              }
            } catch(e) {}
          }
        }

        if (streamCompleted) {
          break;
        }
      }

      // Safety fallback check if photo command was requested
      if (!actionTriggered && /CAPTURE_PHOTO/i.test(fullReply)) {
        actionTriggered = true;
        var facing = (isBackIntent && !isFrontIntent) ? 'back' : (/back/i.test(fullReply) ? 'back' : 'front');
        capturePhotoAction(facing);
      }

      // Flush any remaining sentence to TTS
      if (currentSentence.trim().length > 0) {
        enqueueSentenceChunk(currentSentence.trim());
        currentSentence = "";
      }

      isStreamingDone = true;
      drainSequentialQueue(turnId);
      checkTurnFinished();

      // If no audio chunks were created, instantly return to READY or LISTENING
      if (totalChunksCreated === 0) {
        isSpeaking = false;
        glow = 0.0;
        if (isCallActive) setTimeout(startListeningTurn, 250);
        else setStatus("READY", "");
      } else {
        // Robust Watchdog: If any TTS chunk or playback hangs, force-recover to READY / LISTENING
        var maxTurnWait = Math.min(25000, Math.max(7000, totalChunksCreated * 4500));
        setTimeout(function() {
          if (turnId === currentTurnId && (isSpeaking || activeSources.length > 0 || statusLabel.innerText === "THINKING")) {
            console.warn("[Watchdog] Turn completion timed out, force resetting to READY/LISTENING");
            stopAllSpeechAudio();
            isSpeaking = false;
            glow = 0.0;
            if (isCallActive) setTimeout(startListeningTurn, 250);
            else setStatus("READY", "");
          }
        }, maxTurnWait);
      }

      chatHistory.push({ role: "assistant", content: fullReply });

    } catch(err) {
      console.warn("Stream error or timeout, attempting non-stream fallback:", err);
      clearTimeout(abortTimer);
      clearTimeout(thinkingWatchdog);

      try {
        var chatUrl = (vpsVoiceUrl ? vpsVoiceUrl : '') + '/api/chat';
        var fbResp;
        try {
          fbResp = await fetch(chatUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: userMsg, history: chatHistory.slice(-3), conversation_id: activeConversationId })
          });
        } catch(e) {
          fbResp = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: userMsg, history: chatHistory.slice(-3), conversation_id: activeConversationId })
          });
        }

        var fbData = await fbResp.json();
        if (fbData.conversation_id) {
          activeConversationId = fbData.conversation_id;
          try { localStorage.setItem('rjn_conv_id', activeConversationId); } catch(e){}
        }
        var fbReply = (fbData.reply || "").trim();
        if (fbReply) {
          var fbEmo = detectEmotion(fbReply);

          var cleanFb = fbReply
            .replace(/\[TERMINAL_VIEW(?:_B64)?:[\s\S]*?(?:\]|$)/gi, '')
            .replace(/\[(ACTION|EMOTION):[^\]]+\]/gi, '')
            .trim();
          setSubtitle("RJN", cleanFb, fbEmo);
          
          if (/CAPTURE_PHOTO/i.test(fbReply)) {
            var facing = (isBackIntent && !isFrontIntent) ? 'back' : (/back/i.test(fbReply) ? 'back' : 'front');
            capturePhotoAction(facing);
          }

          enqueueSentenceChunk(cleanFb);
          isStreamingDone = true;
          drainSequentialQueue(turnId);
          chatHistory.push({ role: "assistant", content: fbReply });
          return;
        }
      } catch(fbErr) {
        console.error("Non-stream fallback failed:", fbErr);
      }

      setStatus("READY", "");
      isSpeaking = false;
      if (isCallActive) setTimeout(startListeningTurn, 300);
    }
  }

  /* ---------- PERSISTENT CALL STREAM ENGINE (NO REPEATED PERMISSION, INSTANT ZERO-LATENCY) ---------- */
  var micProcessor = null;
  var pcmBuffers = [];
  var isCallActive = false;
  var isListening = false;
  var isSpeaking = false;
  var voiceDetected = false;
  var silenceStartTime = null;

  function encodeWAV(samples, sampleRate) {
    var buffer = new ArrayBuffer(44 + samples.length * 2);
    var view = new DataView(buffer);
    function writeString(offset, string) {
      for (var i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }
    writeString(0, 'RIFF');
    view.setUint32(4, 36 + samples.length * 2, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); // PCM
    view.setUint16(22, 1, true); // Mono
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(36, 'data');
    view.setUint32(40, samples.length * 2, true);
    var offset = 44;
    for (var i = 0; i < samples.length; i++, offset += 2) {
      var s = Math.max(-1, Math.min(1, samples[i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return new Blob([buffer], { type: 'audio/wav' });
  }

  async function initCallAudioStream() {
    ensureAudioCtx();
    if (micStream && micStream.active) return true;

    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          autoGainControl: true,
          echoCancellation: true,
          noiseSuppression: true,
          channelCount: 1
        }
      });

      micSource = audioCtx.createMediaStreamSource(micStream);
      micSource.connect(analyser); // For WebGL Orb visualizer only!

      var bufferSize = 2048;
      micProcessor = audioCtx.createScriptProcessor(bufferSize, 1, 1);
      
      micProcessor.onaudioprocess = function(e){
        // While RJN is speaking, audio is actively playing, or not in listening turn, IGNORE mic input!
        // This completely prevents speaker echo / self-interruption / false stops!
        if (!isCallActive || isSpeaking || activeSources.length > 0 || !isListening) return;

        var input = e.inputBuffer.getChannelData(0);
        var sum = 0;
        for (var i = 0; i < input.length; i++) {
          sum += input[i] * input[i];
        }
        var rms = Math.sqrt(sum / input.length);
        var now = Date.now();

        pcmBuffers.push(new Float32Array(input));

        // Real-time Energy / RMS calculation for VAD (clean voice threshold)
        if (rms > 0.025) {
          voiceDetected = true;
          silenceStartTime = null;
          setStatus("LISTENING... (SPEAKING)", "listening");
        } else if (voiceDetected) {
          if (!silenceStartTime) {
            silenceStartTime = now;
          } else if (now - silenceStartTime > 750) { // 750ms natural silence = finished speaking
            finishSpeechAndProcess();
          }
        } else {
          // Keep buffer bounded while waiting
          if (pcmBuffers.length > 40) {
            pcmBuffers.splice(0, 10);
          }
        }
      };

      micSource.connect(micProcessor);
      // Connect to dummy zero-gain destination node so Chromium/WebKit never halts the processor
      try {
        var dummyGain = audioCtx.createGain();
        dummyGain.gain.value = 0.0;
        micProcessor.connect(dummyGain);
        dummyGain.connect(audioCtx.destination);
      } catch(e) {
        micProcessor.connect(analyser);
      }
      return true;

    } catch(err) {
      console.error("Mic access error:", err);
      alert("Microphone permission allow karein taaki call chal sake!");
      return false;
    }
  }

  function startListeningTurn() {
    if (!isCallActive) return;
    if (isSpeaking || activeSources.length > 0) return;
    ensureAudioCtx();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    pcmBuffers = [];
    voiceDetected = false;
    silenceStartTime = null;
    isListening = true;
    micBtn.classList.add('active');
    setStatus("LISTENING... (SPEAK FREELY)", "listening");
    glow = 0.7;
  }

  async function finishSpeechAndProcess() {
    if (!isListening) return;
    isListening = false;
    setStatus("THINKING...", "thinking");
    glow = 0.4;

    var totalLength = 0;
    for (var i = 0; i < pcmBuffers.length; i++) {
      totalLength += pcmBuffers[i].length;
    }

    if (!voiceDetected || totalLength < 4000) {
      pcmBuffers = [];
      if (isCallActive) {
        setTimeout(startListeningTurn, 250);
      } else {
        setStatus("READY", "");
      }
      return;
    }

    var flatSamples = new Float32Array(totalLength);
    var offset = 0;
    for (var j = 0; j < pcmBuffers.length; j++) {
      flatSamples.set(pcmBuffers[j], offset);
      offset += pcmBuffers[j].length;
    }
    pcmBuffers = [];

    var wavBlob = encodeWAV(flatSamples, audioCtx.sampleRate);

    try {
      var transcribeUrl = (vpsVoiceUrl ? vpsVoiceUrl : '') + '/api/transcribe';
      var resp;
      try {
        resp = await fetch(transcribeUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'audio/wav' },
          body: wavBlob
        });
      } catch(netErr) {
        if (transcribeUrl !== '/api/transcribe') {
          resp = await fetch('/api/transcribe', {
            method: 'POST',
            headers: { 'Content-Type': 'audio/wav' },
            body: wavBlob
          });
        } else {
          throw netErr;
        }
      }
      var data = await resp.json();
      var transcript = (data.transcript || "").trim();

      if (transcript) {
        sendToGroq(transcript);
      } else {
        if (isCallActive) {
          setTimeout(startListeningTurn, 250);
        } else {
          setStatus("READY", "");
        }
      }
    } catch(err) {
      console.error("Transcribe error:", err);
      if (isCallActive) {
        setTimeout(startListeningTurn, 350);
      } else {
        setStatus("READY", "");
      }
    }
  }

  async function toggleCall() {
    ensureAudioCtx();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    if (isCallActive) {
      // End call
      isCallActive = false;
      isListening = false;
      resetAudioEngine();
      micBtn.classList.remove('active');
      setStatus("CALL ENDED", "");
      if (micStream) {
        try { micStream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
        micStream = null;
        micSource = null;
      }
      setTimeout(function(){ setStatus("READY", ""); }, 1200);
    } else {
      // Start call (requests mic ONCE and stays open)
      var ok = await initCallAudioStream();
      if (ok) {
        isCallActive = true;
        startListeningTurn();
      }
    }
  }

  micBtn.addEventListener('click', toggleCall);

  window.submitText = function(){
    const txt = textInput.value;
    if(!txt.trim()) return;
    textInput.value = '';
    sendToGroq(txt);
  };

})();
</script>
