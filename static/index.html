<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROX 3D - Humanoid AI Voice Agent</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="hud-overlay">
        <!-- Top HUD Bar -->
        <div class="hud-header">
            <div class="brand">
                <div class="brand-logo">R</div>
                <div>
                    <h1 class="brand-title">ROX AI</h1>
                    <div style="font-size: 11px; color: var(--text-dim); letter-spacing: 0.5px;">3D HUMANOID NEURAL CORE</div>
                </div>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <input id="avatar-url-input" type="text" placeholder="Paste .GLB / ReadyPlayerMe URL..." style="background: rgba(13,20,36,0.8); border: 1px solid var(--border); color: #fff; font-size: 11px; padding: 5px 10px; border-radius: 12px; outline: none; width: 170px;">
                <button onclick="loadAvatar(document.getElementById('avatar-url-input').value)" style="background: var(--primary); border: none; color: #000; font-size: 11px; font-weight: bold; padding: 5px 10px; border-radius: 10px; cursor: pointer;">Load</button>
            </div>
            <div class="status-badge">
                <span class="status-dot"></span>
                <span id="system-status">NEURAL LINK ACTIVE</span>
            </div>
        </div>

        <!-- Chat History Window -->
        <div class="hud-chat-box" id="chat-box">
            <div class="chat-bubble rox">
                <strong>ROX:</strong> Haan bhai! Main Rox hoon — tumhara 3D Humanoid AI Assistant. Kaho kya hukam hai?
            </div>
        </div>

        <!-- Bottom Voice & Control Bar -->
        <div class="hud-bottom">
            <canvas id="visualizer" class="visualizer-canvas"></canvas>
            <div class="input-bar">
                <button class="btn-icon btn-mic" id="mic-btn" title="Tap to Speak">🎤</button>
                <input type="text" id="user-input" placeholder="Rox se kuch pucho ya mic dabao..." autocomplete="off">
                <button class="btn-icon btn-send" id="send-btn" title="Send Message">➤</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
